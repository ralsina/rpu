version: '3.8'

services:
  # Crystal Projects Visualization Web Server
  rpu-server:
    build: .
    container_name: rpu-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GITHUB_USER=${GITHUB_USER:-ralsina}
      - MAX_DEPTH=${MAX_DEPTH:-3}
      - MAX_PROJECTS=${MAX_PROJECTS:-500}
      - RATE_LIMIT_DELAY=${RATE_LIMIT_DELAY:-0.1}
      - DATA_FILE=/app/public/projects.json
    volumes:
      - ./data:/app/public
      - rpu-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rpu-network

  # Data Collection Service (run as needed)
  rpu-collect:
    build: .
    container_name: rpu-collect
    command: collect_data
    environment:
      - GITHUB_USER=${GITHUB_USER:-ralsina}
      - MAX_DEPTH=${MAX_DEPTH:-3}
      - MAX_PROJECTS=${MAX_PROJECTS:-500}
      - RATE_LIMIT_DELAY=${RATE_LIMIT_DELAY:-0.1}
      - DATA_FILE=/app/public/projects.json
    volumes:
      - ./data:/app/public
      - rpu-data:/app/data
    profiles:
      - collect  # Only start with --profile collect
    networks:
      - rpu-network
    # Run as a one-shot service by default
    restart: "no"

volumes:
  rpu-data:
    driver: local

networks:
  rpu-network:
    driver: bridge

# Configuration profiles for different use cases
x-common-variables: &common-variables
  GITHUB_USER: ralsina
  MAX_DEPTH: 3
  MAX_PROJECTS: 500
  RATE_LIMIT_DELAY: 0.1

# Development configuration
x-development: &development
  environment:
    <<: *common-variables
    MAX_DEPTH: 2
    MAX_PROJECTS: 50
    RATE_LIMIT_DELAY: 0.5

# Production configuration
x-production: &production
  environment:
    <<: *common-variables
    MAX_DEPTH: 5
    MAX_PROJECTS: 1000
    RATE_LIMIT_DELAY: 0.2
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 256M